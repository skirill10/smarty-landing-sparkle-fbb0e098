name: Build static site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun run typecheck
          bun run lint

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          BUILD_COMMIT: ${{ github.sha }}
        run: bun run build

      - name: Add server config to the build output
        run: |
          test -f dist/client/index.html || { echo "::error::dist/client/index.html missing - build produced no output"; exit 1; }
          cp .htaccess dist/client/.htaccess
          # GitHub Pages / static hosts must not treat _-prefixed asset dirs specially
          touch dist/client/.nojekyll
          echo "Files to publish: $(find dist/client -type f | wc -l)"
          cat dist/client/version.json || true

      - name: Smoke test static artifact
        run: bun run smoke:static

      - name: Publish build output to the deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist/client
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A parent .gitignore must never filter the build output
          printf '' > .gitignore
          git add -A
          git commit -q --allow-empty -m "chore: static build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin deploy
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/deploy | awk '{print $1}')"
          test "$LOCAL_SHA" = "$REMOTE_SHA" || { echo "::error::Remote deploy branch verification failed"; exit 1; }
          echo "Pushed ${LOCAL_SHA:0:7} to deploy and verified the remote branch"

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartytel-static-${{ github.run_number }}
          path: dist/client
          include-hidden-files: true
          retention-days: 7
