name: Build static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
        run: bun run build

      - name: Add server config to the build output
        run: cp .htaccess dist/client/.htaccess

      - name: Publish build output to the deploy branch
        run: |
          cd dist/client
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "chore: static build $GITHUB_SHA"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
